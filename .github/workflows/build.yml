name: Build Shinygram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone Telegram Source
        run: |
          git clone --depth 1 https://github.com/DrKLO/Telegram.git client

      - name: Inject Version Properties & Rename to Shinygram
        run: |
          cd client
          # Прописываем все недостающие параметры версии и базовые ключи
          cat <<EOT >> gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          APP_VERSION_NAME=10.0.0
          APP_VERSION_CODE=3000
          APP_HASH=8e96683260843236e788737274092b3c
          APP_ID=6
          EOT

          # Переименовываем приложение в Shinygram
          find TMessagesProj/src/main/res -name "strings.xml" -exec sed -i 's/<string name="AppName">.*<\/string>/<string name="AppName">Shinygram<\/string>/g' {} + || true
          find TMessagesProj/src/main/res -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Shinygram<\/string>/g' {} + || true

      - name: Build APK
        run: |
          cd client
          chmod +x gradlew
          ./gradlew assembleAfatDebug -PAPP_VERSION_NAME=10.0.0 -PAPP_VERSION_CODE=3000 --no-daemon -x test -x lint

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Shinygram-APK
          path: client/TMessagesProj/build/outputs/apk/**/*.apk
          
