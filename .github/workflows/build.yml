name: Build Shinygram Fast

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Apktool & Signer
        run: |
          sudo apt-get update && sudo apt-get install -y aapt
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool apktool.jar
          sudo mv apktool apktool.jar /usr/local/bin/
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      - name: Download Pure Telegram & Rename to Shinygram
        run: |
          # Скачиваем чистый официальный клиент Telegram
          wget -q https://telegram.org/dl/android/apk -O telegram_clean.apk
          
          # Распаковываем ресурсы
          apktool d telegram_clean.apk -o tg_src -f
          
          # Меняем имя приложения на Shinygram во всех языковых ресурсах
          find tg_src/res -name "strings.xml" -exec sed -i 's/<string name="AppName">.*<\/string>/<string name="AppName">Shinygram<\/string>/g' {} + || true
          find tg_src/res -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Shinygram<\/string>/g' {} + || true

          # Запаковываем обратно
          apktool b tg_src -o Shinygram_unsigned.apk

          # Подписываем APK
          java -jar uber-apk-signer.jar --apks Shinygram_unsigned.apk --out output

      - name: Upload Finished Shinygram APK
        uses: actions/upload-artifact@v4
        with:
          name: Shinygram-APK
          path: output/*.apk
          
