name: Build Shinygram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;21.4.7075529" "cmake;3.10.2.4988404"

      - name: Clone Clean Telegram Source
        run: |
          git clone --depth 1 https://github.com/Telegram-FOSS-Team/Telegram-FOSS.git client

      - name: Configure and Rename to Shinygram
        run: |
          cd client
          # Убираем устаревший параметр памяти, ломающий сборку
          sed -i 's/-XX:MaxPermSize=[^ ]*//g' gradle.properties || true
          
          # Задаем название приложения Shinygram
          find . -name "strings.xml" -exec sed -i 's/<string name="AppName">.*<\/string>/<string name="AppName">Shinygram<\/string>/g' {} + || true
          find . -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Shinygram<\/string>/g' {} + || true

      - name: Build APK
        run: |
          cd client
          chmod +x gradlew
          ./gradlew assembleAfatDebug --no-daemon -x lint -x test

      - name: Upload Shinygram APK
        uses: actions/upload-artifact@v4
        with:
          name: Shinygram-Clean-APK
          path: client/TMessagesProj/build/outputs/apk/**/*.apk
          
