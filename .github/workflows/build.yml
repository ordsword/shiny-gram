name: Build Custom Telegram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Clone Nekogram Source
        run: |
          git clone --depth 1 https://github.com/Neko-X/Nekogram.git client

      - name: Build APK with Gradle
        run: |
          cd client
          chmod +x gradlew
          ./gradlew assembleAfatDebug --no-daemon -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shinygram
          path: client/TMessagesProj/build/outputs/apk/**/*.apk
          
