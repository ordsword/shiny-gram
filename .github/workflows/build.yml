name: Build Shinygram Fast

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Tools & Telegram
        run: |
          mkdir -p output
          # Скачиваем официальный стабильный Apktool и Signer с GitHub
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          curl -L -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          # Скачиваем чистый официальный Telegram APK
          curl -L -A "Mozilla/5.0" -o clean_tg.apk https://telegram.org/dl/android/apk

      - name: Process & Rename to Shinygram
        run: |
          # Распаковываем ресурсы
          java -jar apktool.jar d clean_tg.apk -o tg_source --no-src -f
          
          # Переименовываем во всех языковых ресурсах приложения
          find tg_source/res -name "strings.xml" -exec sed -i 's/<string name="AppName">.*<\/string>/<string name="AppName">Shinygram<\/string>/g' {} + || true
          find tg_source/res -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Shinygram<\/string>/g' {} + || true

          # Собираем обратно
          java -jar apktool.jar b tg_source -o Shinygram_unsigned.apk

          # Подписываем тестовым Android-ключом
          java -jar uber-apk-signer.jar --apks Shinygram_unsigned.apk --out output

      - name: Upload Finished Shinygram APK
        uses: actions/upload-artifact@v4
        with:
          name: Shinygram-App
          path: output/*.apk
          if-no-files-found: error
          
