name: Build Shinygram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone Telegram Lite Source
        run: |
          git clone --depth 1 https://github.com/DrKLO/Telegram.git client

      - name: Configure App Name to Shinygram
        run: |
          cd client
          # Увеличиваем лимиты памяти Gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          
          # Меняем имя приложения на Shinygram
          find TMessagesProj/src/main/res -name "strings.xml" -exec sed -i 's/<string name="AppName">.*<\/string>/<string name="AppName">Shinygram<\/string>/g' {} + || true
          find TMessagesProj/src/main/res -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Shinygram<\/string>/g' {} + || true

      - name: Build Debug APK
        run: |
          cd client
          chmod +x gradlew
          ./gradlew assembleAfatDebug --no-daemon -x test -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shinygram-App
          path: client/TMessagesProj/build/outputs/apk/**/*.apk
          
